[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscore"
version = "1.0.0"
description = "A phishing susceptibility scoring engine powered by expert insights."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "joblib>=1.3",
]

[project.scripts]
phishscore = "phishscore.cli:main"

[tool.setuptools.packages.find]
include = ["phishscore*"]
